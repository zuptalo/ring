# Release candidate: hand testers a pinned pre-release build without shipping it as
# "latest". Triggered by pushing a vX.Y.Z-rc.N tag (typically off develop) - it
# re-runs the full build + test suite on the tagged commit and, only if that is
# green, publishes a single immutable image (ghcr.io/zuptalo/ring:X.Y.Z-rc.N) and
# cuts a GitHub *pre-release*.
#
# Deliberately separate from release.yml (which fires on merge to main and owns the
# moving latest/X.Y tags): an RC must NEVER move :latest or :X.Y, so production
# deploys tracking those tags can't pick it up. The version is read from the tag
# name, not package.json - on develop package.json still carries the in-progress
# version (e.g. 0.1.0), while the tag is the real RC identity (e.g. v0.2.0-rc.1),
# and that is what gets stamped into the image so the About page shows the truth.
#
# To cut one: git tag v0.2.0-rc.1 && git push origin v0.2.0-rc.1
name: Release candidate

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+']

concurrency:
  group: release-rc-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/build-test.yml

  publish:
    name: RC image and pre-release
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub pre-release
      packages: write # push the RC image to GHCR
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so the pre-release notes can diff from the last tag

      - name: Resolve version from tag
        id: ver
        # The tag IS the version of record for an RC (package.json lags on develop).
        run: |
          tag="${GITHUB_REF_NAME}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3 # arm64 emulation for the final stage
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/zuptalo/ring
          # The exact RC version only - never latest, never X.Y (those belong to
          # stable releases and must keep pointing at the last GA build).
          tags: |
            type=raw,value=${{ steps.ver.outputs.version }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.ver.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.ver.outputs.tag }}" \
            --title "${{ steps.ver.outputs.tag }}" \
            --target "${{ github.sha }}" \
            --prerelease \
            --generate-notes
