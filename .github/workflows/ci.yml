# CI: runs the full build + test suite on every PR into main that touches code
# (path-filtered — doc/spec/tooling-only changes skip it). `main` is the ONLY
# long-lived branch: work happens on short-lived feature branches that PR straight
# into it, and every such merge cuts a release (see the release guard below), so
# this suite is the gate that stands between a feature branch and production.
#
# There is deliberately NO push trigger. Merging a PR produces a tree this suite has
# already passed on, and release.yml proves that identity (same tree as the merged
# branch) before it ships — so a run here would re-test the very bytes that just went
# green. When a merge DOES combine work into a new tree, release.yml runs the full
# suite itself rather than leaving it to a push trigger that fires on some merges and
# not others (a GITHUB_TOKEN auto-merge never fires it at all).
name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch: # manual re-run of the suite against any ref

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Detect whether this change touches anything the heavy build/test/e2e jobs
  # actually validate. Doc/spec/tooling-only changes (markdown, specs/, .specify/,
  # ROADMAP.md, scripts/) skip the heavy suite — the always-on roadmap-guard below
  # is the real gate for those. Anything in app code, server, e2e, deps, configs,
  # the Dockerfile, or the workflows themselves runs the full suite.
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # paths-filter needs history to diff against the base
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          # Empty token forces local git-based diffing instead of the GitHub REST
          # API's listFiles endpoint. The API path 404s on a PR with a very large
          # diff (seen on the first-ever release PR, 1000+ files since main started
          # nearly empty) — git diff has no such limit and we already have full
          # history via fetch-depth: 0 above.
          token: ''
          # `code` is true when ANY path the heavy jobs cover changed. If nothing
          # here matched, the change is docs/specs/tooling-only and verify is skipped.
          filters: |
            code:
              - 'src/**'
              - 'server/**'
              - 'e2e/**'
              - 'public/**'
              - 'index.html'
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig*.json'
              - 'vite.config.*'
              - 'vitest.config.*'
              - 'playwright.config.*'
              - 'Dockerfile'
              - '.dockerignore'
              - '.github/workflows/**'

  # The full build + test suite, on PRs (where it must pass before the PR can
  # merge) and on manual workflow_dispatch. Path-filtering skips it for
  # doc/spec/tooling-only changes.
  verify:
    needs: changes
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && needs.changes.outputs.code == 'true') }}
    uses: ./.github/workflows/build-test.yml

  # Every merge into main ships, so every PR into main must carry a version bump.
  # Without this a merge silently no-ops in release.yml (the tag already exists) —
  # green CI, no image, no release, no signal. This makes that mistake un-mergeable.
  #
  # NOTE on concurrent PRs: the required checks are non-strict (a PR does not have
  # to be up to date with main to merge), so two open PRs can both bump to the SAME
  # version and both pass this guard. The first to merge ships it; the second then
  # FAILS loudly in release.yml ("already shipped") rather than skipping in silence —
  # from its preflight job, in seconds, before the suite gets a chance to run.
  # Rebase and re-bump that one. Merging one PR at a time avoids it entirely.
  release-guard:
    name: Release guard (version bump)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # need main's history + tags to compare against
      - name: Require a version bump
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail

          # main is the only PR target, but stay defensive: a PR aimed anywhere else
          # (a stacked branch, say) isn't shipping, so it isn't held to a bump.
          if [ "$BASE_REF" != "main" ]; then
            echo "Base is '$BASE_REF', not main — this PR doesn't ship, so no version bump required."
            exit 0
          fi

          head_ver=$(node -p "require('./package.json').version")
          git fetch --quiet origin main
          base_ver=$(git show origin/main:package.json | node -p "JSON.parse(require('fs').readFileSync(0)).version")
          echo "head (this PR) version: $head_ver"
          echo "base (main) version:    $base_ver"

          fail() { echo "::error::$1"; exit 1; }

          if [ "$head_ver" = "$base_ver" ]; then
            fail "package.json version is still $base_ver — merging this PR would no-op the release. Bump it with 'npm run release:patch' (or :minor / :major) and push."
          fi

          # Strictly greater than main (catches an accidental downgrade too).
          greater=$(printf '%s\n%s\n' "$base_ver" "$head_ver" | sort -V | tail -n1)
          if [ "$greater" != "$head_ver" ]; then
            fail "package.json version $head_ver is not greater than main's $base_ver. Bump it forward with 'npm run release:patch' (or :minor / :major)."
          fi

          # The tag for this version must not already exist (already-shipped).
          git fetch --quiet --tags origin
          if git rev-parse "refs/tags/v$head_ver" >/dev/null 2>&1; then
            fail "Tag v$head_ver already exists — version $head_ver has already shipped. Bump to a new version with 'npm run release:patch' (or :minor / :major)."
          fi

          echo "✓ Version bumped $base_ver → $head_ver and v$head_ver is unreleased. Good to merge."

  # Keep ROADMAP.md honest: it is generated from specs/<NNNN-slug>/spec.md, so a
  # spec added or a Status bumped without regenerating would let the roadmap drift
  # from what's actually checked in. This fails the build until `make roadmap` is
  # run and the result committed. Cheap, and runs on every PR.
  roadmap-guard:
    name: Roadmap up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Verify ROADMAP.md matches specs/
        run: python3 scripts/roadmap-gen.py --check

  # Single required status check for branch protection. Because `verify` is
  # conditionally skipped, its individual "verify / *" checks can't be required
  # directly — a skipped-but-required check blocks the PR forever. This gate runs
  # ALWAYS and passes when every upstream job either succeeded or was deliberately
  # skipped, failing only if one actually failed or was cancelled. Branch protection
  # requires THIS plus the always-on roadmap + release guards (see
  # scripts/setup-branch-protection.sh).
  ci-gate:
    name: CI gate
    if: always()
    needs: [changes, verify, roadmap-guard, release-guard]
    runs-on: ubuntu-latest
    steps:
      - name: Require every upstream job to have passed (or been skipped)
        run: |
          set -euo pipefail
          declare -A results=(
            [changes]='${{ needs.changes.result }}'
            [verify]='${{ needs.verify.result }}'
            [roadmap-guard]='${{ needs.roadmap-guard.result }}'
            [release-guard]='${{ needs.release-guard.result }}'
          )
          fail=0
          for job in "${!results[@]}"; do
            r="${results[$job]}"
            echo "$job: $r"
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then fail=1; fi
          done
          if [ "$fail" = "1" ]; then
            echo "::error::a required CI job did not pass"; exit 1
          fi
          echo "All required CI jobs passed or were intentionally skipped."
