# Release: fires when a feature branch is merged into main. It re-runs the full
# build + test suite on the merge commit and, only if that is green, tags main with
# the package.json version, publishes the production image, and cuts a GitHub
# release whose notes are the version plus one bullet per change since the last tag.
#
# `main` is the only long-lived branch, so EVERY merge into it ships. Versioning is
# driven by package.json: bump the "version" on your feature branch and open a PR
# into main — ci.yml's release guard refuses the PR without a bump, and merging it
# releases. There is no separate "cut a release" step.
#
# It does NOT re-run the suite on a tree that has already passed it. A merge commit
# whose tree is byte-identical to the merged branch's tree contains exactly what the
# PR's required checks went green on, so a second full run would spend ~33 minutes
# re-deriving a known answer while the fix waits to reach users. The `proven` job
# below establishes that identity; when it cannot (main moved under the PR, so the
# merge genuinely COMBINED work into a tree nothing has ever tested), the full suite
# runs before anything is tagged or published. Every tree that reaches production is
# covered by a full run — exactly one.
#
# If the tag for the current version already exists (two PRs that bumped to the same
# version, say), this FAILS rather than skipping quietly — whatever triggered it. A
# release that ships nothing is exactly the signal-less outcome the release guard
# exists to prevent, and it must not be able to hide behind a green run. Re-running a
# shipped version by hand is still possible, but you have to say so: dispatch with
# allow_noop=true.
name: Release

on:
  push:
    branches: [main]
  # A GITHUB_TOKEN-authored push (auto-merge-release.yml's auto-merge) doesn't
  # trigger the push event above (anti-infinite-loop safeguard) — workflow_dispatch
  # is exempt from that, so auto-merge-release.yml calls this explicitly once an
  # auto-merged PR lands. In practice that makes workflow_dispatch the NORMAL path
  # and push the exception, which is why neither the release commit nor the no-op
  # guard below may be inferred from the event type.
  workflow_dispatch:
    inputs:
      sha:
        description: 'Exact commit to release (the merge commit). Defaults to the ref this runs on.'
        required: false
        type: string
      allow_noop:
        description: "Proceed quietly if this version already shipped. Only for a deliberate re-run — leave false so a merge that ships nothing FAILS."
        required: false
        default: false
        type: boolean

# One run per released COMMIT, not one for the whole branch. Each dispatch is pinned
# to its own merge commit now, so releases do not need to serialize against each
# other — and they must not: with a single shared group, GitHub keeps one running
# plus one pending run and CANCELS the older pending one, so three merges inside a
# release window would drop the middle release with no error anywhere. Keyed per sha,
# the only thing this collapses is a genuine duplicate dispatch of the same commit.
concurrency:
  group: release-${{ inputs.sha || github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Two instant questions, asked before anything expensive: can this even ship, and
  # has this exact tree already passed the full suite?
  #
  # Branch protection will not merge a PR whose required checks are not green on its
  # HEAD commit, and pushing to the branch after they pass makes them stale and blocks
  # the merge again. So for a merge commit M with parents (previous main, PR head):
  # if tree(M) == tree(M^2), the bytes being shipped ARE the bytes the suite passed on,
  # and re-running proves nothing. If main moved under the PR, tree(M) is a combination
  # no run has ever seen, and it must be verified like anything else.
  #
  # Anything that is not a merge commit (a direct push, a hand-run dispatch on an
  # arbitrary ref) is never assumed proven.
  preflight:
    name: Preflight (version + proven tree)
    runs-on: ubuntu-latest
    outputs:
      proven: ${{ steps.tree.outputs.proven }}
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
      shipped: ${{ steps.shipped.outputs.exists }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # need both parents of the merge commit, and the tags
          # Pin to the commit that was actually proven. `--ref main` would resolve to
          # main's tip AT DISPATCH TIME, and auto-merge means a second PR can land in
          # the poll window — releasing its version and silently skipping the one this
          # dispatch was for, which would then never be tagged at all.
          ref: ${{ inputs.sha || github.sha }}

      - name: Resolve version
        id: ver
        run: |
          v=$(node -p "require('./package.json').version")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "tag=v$v" >> "$GITHUB_OUTPUT"

      # FIRST, because it is instant and it can make everything below pointless. A
      # merge that cannot ship must say so in seconds, not after a ~33-minute suite.
      - name: Has this version already shipped?
        id: shipped
        env:
          # Every release reaching a user came from a merge that was SUPPOSED to ship
          # (the release guard made its PR carry a bump). Finding the tag already there
          # means it won't — fail, so it cannot pass unnoticed.
          #
          # This deliberately does NOT key on github.event_name. An auto-merged PR
          # reaches us as workflow_dispatch, not push, so an event-based guard would be
          # dead on the one path that matters. Silence is opt-in instead: a human
          # re-running a shipped version passes allow_noop=true and says so out loud.
          ALLOW_NOOP: ${{ inputs.allow_noop }}
        run: |
          tag="${{ steps.ver.outputs.tag }}"
          if ! git rev-parse "refs/tags/$tag" >/dev/null 2>&1; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tagged=$(git rev-list -n1 "refs/tags/$tag")
          here=$(git rev-parse HEAD)
          if [ "$tagged" = "$here" ]; then
            # We already released THIS commit. Two dispatch paths racing (the poller
            # and the merged-PR trigger), or a re-run — nothing is missing, so this is
            # not the silent-no-op case and must not go red.
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$tag already points at $here — this commit is already released. Nothing to do."
          elif [ "$ALLOW_NOOP" = "true" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$tag exists (on $tagged) and allow_noop was set — skipping the release steps."
          else
            echo "::error::Tag $tag already exists on a DIFFERENT commit ($tagged), so releasing $here would ship NOTHING. Two PRs most likely bumped to the same version. Open a follow-up PR that bumps package.json again ('npm run release:patch') to release these changes. If this is a deliberate re-run, dispatch again with allow_noop=true."
            exit 1
          fi

      - name: Is this tree already proven?
        id: tree
        run: |
          set -euo pipefail
          parents=$(git rev-list --parents -n1 HEAD | wc -w)
          if [ "$parents" -lt 3 ]; then
            echo "HEAD is not a merge commit — nothing to compare against, so verify."
            echo "proven=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          head_tree=$(git rev-parse 'HEAD^{tree}')
          branch_tree=$(git rev-parse 'HEAD^2^{tree}')
          echo "merge commit tree:  $head_tree"
          echo "merged branch tree: $branch_tree"
          if [ "$head_tree" = "$branch_tree" ]; then
            echo "::notice::Identical to the tree whose required checks passed on the PR — shipping it without a second run."
            echo "proven=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::The merge combined work (main moved under the PR), so this tree is new. Running the full suite."
            echo "proven=false" >> "$GITHUB_OUTPUT"
          fi

  verify:
    needs: preflight
    if: needs.preflight.outputs.proven != 'true' && needs.preflight.outputs.shipped != 'true'
    uses: ./.github/workflows/build-test.yml
    # The same commit preflight examined and release will publish. A called workflow
    # defaults to the CALLER's github.sha, which for a dispatch is main's tip — so
    # without this the suite could certify one tree while we shipped another.
    with:
      sha: ${{ inputs.sha || github.sha }}

  release:
    name: Tag, image, and GitHub release
    needs: [preflight, verify]
    # `verify` is skipped on the fast path, and a skipped dependency would skip this
    # job too — so gate explicitly: proceed when verify passed OR was deliberately
    # skipped, never when it failed or was cancelled.
    if: >-
      always() &&
      needs.preflight.result == 'success' &&
      (needs.verify.result == 'success' || needs.verify.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the tag + the GitHub release
      packages: write # push the production image to GHCR
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # full history so release notes can diff from the last tag
          ref: ${{ inputs.sha || github.sha }} # the proven commit, as in preflight

      # Compose the build's release notes BEFORE creating the new tag, so the script's
      # "since the last release tag" range is this release's changes (the previous tag
      # is still the highest one). Baked into the image for the PWA's "what's new".
      - name: Compose release notes (base64 JSON)
        id: notes_b64
        if: needs.preflight.outputs.shipped == 'false'
        run: echo "b64=$(scripts/release-notes.sh | base64 -w0)" >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        if: needs.preflight.outputs.shipped == 'false'
        run: |
          # An annotated tag needs a committer identity; the runner has none by
          # default (fatal: empty ident name). Set the standard github-actions bot.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ needs.preflight.outputs.tag }}" -m "Release ${{ needs.preflight.outputs.tag }}"
          git push origin "${{ needs.preflight.outputs.tag }}"

      - uses: docker/setup-qemu-action@v4 # arm64 emulation for the final stage
        if: needs.preflight.outputs.shipped == 'false'
      - uses: docker/setup-buildx-action@v4
        if: needs.preflight.outputs.shipped == 'false'
      - uses: docker/login-action@v4
        if: needs.preflight.outputs.shipped == 'false'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Mirror the production image to Docker Hub (canonical registry stays ghcr.io).
      - uses: docker/login-action@v4
        if: needs.preflight.outputs.shipped == 'false'
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        if: needs.preflight.outputs.shipped == 'false'
        with:
          images: |
            ghcr.io/zuptalo/ring
            docker.io/zuptalo/ring
          # latest + full semver + major.minor, all pointing at this release.
          tags: |
            type=raw,value=latest
            type=semver,pattern={{version}},value=${{ needs.preflight.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.preflight.outputs.version }}
      - uses: docker/build-push-action@v7
        if: needs.preflight.outputs.shipped == 'false'
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.preflight.outputs.version }}
            RELEASE_NOTES_B64=${{ steps.notes_b64.outputs.b64 }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Human-readable release notes: user-facing changes since the previous STABLE
      # release, grouped (New / Fixes / …) and prettified with the same filter + wording
      # rules the in-app "What's new" uses (scripts/release-notes-md.mjs). ci/docs/chore
      # noise is dropped; a spec/PR ref is stripped. Basing on the last stable tag (not
      # the RC) means a GA release shows the whole product delta, not just the RC gap.
      - name: Compose release notes
        if: needs.preflight.outputs.shipped == 'false'
        run: |
          node scripts/release-notes-md.mjs --tag "${{ needs.preflight.outputs.tag }}" \
            --repo "${{ github.repository }}" > release-notes.md
          echo "Generated release notes:"; cat release-notes.md

      - name: Create GitHub release
        if: needs.preflight.outputs.shipped == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ needs.preflight.outputs.tag }}" \
            --title "Ring ${{ needs.preflight.outputs.version }}" \
            --target "${{ inputs.sha || github.sha }}" \
            --notes-file release-notes.md

      # Keep the Docker Hub repo's Overview (README + short description) in sync with
      # docs/DOCKERHUB.md on every release, so the public listing never drifts. This
      # used to ride the rolling develop publish, which no longer exists.
      # Best-effort: editing the Hub Overview needs a token scope an image-push PAT lacks
      # (returns 403 Forbidden), so DON'T fail a shipped release on a cosmetic README
      # sync — the image and the GitHub release are already out. Fix the token to re-enable.
      - name: Sync Docker Hub Overview
        if: needs.preflight.outputs.shipped == 'false'
        continue-on-error: true
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: zuptalo/ring
          short-description: 'Private, end-to-end-encrypted messenger & calling app — self-hostable PWA + Go backend (AGPL).'
          readme-filepath: ./docs/DOCKERHUB.md
