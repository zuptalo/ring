# Reusable build + test pipeline, called by ci.yml (develop pushes, PRs) and
# release.yml (main). Keeping it in one place means the exact same gates run
# before a develop image and before a production release.
name: build-test

on:
  workflow_call:

permissions:
  contents: read

jobs:
  client:
    name: Client (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # `npm run build` is `vue-tsc --noEmit && vite build`: typecheck then bundle.
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist
          retention-days: 7

  client-test:
    name: Client (unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Vitest unit tests for the crypto core + pure logic, with the coverage floor
      # enforced (vitest.config.ts thresholds). No browser/DB needed (Node env).
      - run: npm run test:unit:coverage

  server:
    name: Server (build + vet + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: server/go.sum
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
      # Coverage floor on the pure, security-critical packages. The DB/TURN/SFU
      # packages need a live backend and stay covered by the e2e suite, so they are
      # intentionally not gated here. Ratchet these floors up as coverage grows.
      - name: Coverage floor (critical packages)
        run: |
          set -euo pipefail
          declare -A floors=( [auth]=90 [config]=85 [secrets]=70 )
          for pkg in "${!floors[@]}"; do
            go test "./internal/$pkg/" -covermode=set -coverprofile=/tmp/cover.out >/dev/null
            pct=$(go tool cover -func=/tmp/cover.out | awk '/^total:/ {print substr($3, 1, length($3)-1)}')
            floor=${floors[$pkg]}
            echo "internal/$pkg: ${pct}% (floor ${floor}%)"
            awk -v p="$pct" -v f="$floor" 'BEGIN { exit (p+0 >= f+0) ? 0 : 1 }' || {
              echo "::error::internal/$pkg coverage ${pct}% is below the ${floor}% floor"; exit 1; }
          done

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: server/go.sum
      - run: npm ci
      # global-setup.ts resets the ring_e2e DB inside this container and builds +
      # launches an isolated test ringd; bring the database up and wait for health.
      - name: Start PostgreSQL
        run: docker compose -f server/docker-compose.yml up -d --wait
      # Cache the downloaded browser binaries (~150 MB) keyed off the lockfile, which
      # pins the Playwright version, so we only re-download when it changes. The
      # install below still runs --with-deps (apt OS libs) quickly; on a cache hit it
      # finds the browsers present and skips the download.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: playwright-${{ runner.os }}-
      - name: Install Playwright (chromium + system deps)
        run: npx playwright install --with-deps chromium
      - name: Run e2e
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
