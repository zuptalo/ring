    <use href="#videocam"   transform="translate(20,140)  rotate(10)  scale(1.0)"/>
    <use href="#pin"        transform="translate(84,132)  rotate(-7)  scale(0.9)"/>
    <use href="#shield"     transform="translate(142,144) rotate(20)  scale(0.8)"/>
    <use href="#bell"       transform="translate(198,130) rotate(-12) scale(0.95)"/>
    <use href="#flower"     transform="translate(260,142) rotate(5)   scale(0.9)"/>
    <use href="#clock"      transform="translate(318,132) rotate(-4)  scale(0.9)"/>
    <use href="#mail"       transform="translate(14,200)  rotate(-9)  scale(0.95)"/>
    <use href="#sun"        transform="translate(78,194)  rotate(11)  scale(0.9)"/>
    <use href="#mic"        transform="translate(140,202) rotate(-14) scale(0.95)"/>
    <use href="#heart"      transform="translate(196,192) rotate(9)   scale(0.8)"/>
    <use href="#dice"       transform="translate(252,204) rotate(-6)  scale(0.85)"/>
