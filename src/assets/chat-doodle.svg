    <g id="flower"><circle cx="12" cy="12" r="2.6"/><circle cx="12" cy="5.8" r="2.9"/><circle cx="17.8" cy="9.9" r="2.9"/><circle cx="15.6" cy="16.7" r="2.9"/><circle cx="8.4" cy="16.7" r="2.9"/><circle cx="6.2" cy="9.9" r="2.9"/></g>
