    <use href="#note"       transform="translate(80,20)   rotate(9)   scale(0.9)"/>
    <use href="#heart"      transform="translate(140,10)  rotate(-8)  scale(1.0)"/>
    <use href="#camera"     transform="translate(196,22)  rotate(6)   scale(0.95)"/>
