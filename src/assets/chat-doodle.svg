    <use href="#coffee"     transform="translate(12,78)   rotate(7)   scale(0.95)"/>
    <use href="#bubble"     transform="translate(74,70)   rotate(-10) scale(1.15)"/>
    <use href="#star"       transform="translate(144,80)  rotate(12)  scale(0.85)"/>
    <use href="#lock"       transform="translate(200,68)  rotate(-6)  scale(0.9)"/>
